# Free remote CI on GitLab.com shared runners (no GitHub Actions minutes).
# Mirror: GitLab → New project → Import repository (GitHub URL) or add a git remote.
# Local default remains `make ci` / `hotflow ci` / `scripts/ci_local.sh`.

image: python:3.12-bookworm

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

stages:
  - smoke

smoke:
  stage: smoke
  interruptible: true
  script:
    - apt-get update && apt-get install -y --no-install-recommends git make
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - make ci
