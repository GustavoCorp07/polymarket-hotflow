# Paper-mode local stack. LIVE is not enabled by this compose file.
services:
  hotflow:
    build: .
    image: hotflow:paper
    environment:
      HOTFLOW_TRADING_MODE: paper
      HOTFLOW_ACCEPT_LIVE: "0"
      HOTFLOW_CONFIG: /app/configs/default.yaml
    volumes:
      - ./configs:/app/configs:ro
      - ./reports:/app/reports
      - ./data:/app/data
    command: ["hotflow", "paper-run", "--cycles", "1"]
    # Optional scrape / UI: serve-metrics (:9108) or dashboard (:9109). PAPER only.
    ports:
      - "9108:9108"
      - "9109:9109"
