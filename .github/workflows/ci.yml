name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Typecheck
        run: mypy src/hotflow
      - name: Tests
        run: pytest -q
      - name: Paper mock smoke
        run: hotflow paper-run --mock --out reports/ci-paper.json
