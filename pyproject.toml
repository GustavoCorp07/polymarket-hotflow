[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotflow"
version = "0.1.0"
description = "POLYMARKET HOTFLOW — paper-first autonomous multi-market quant system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HOTFLOW" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "polars>=1.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "prometheus-client>=0.20",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]
# Official SDK is optional; public Gamma/CLOB HTTP is the paper-mode default.
# https://docs.polymarket.com/getting-started/python
polymarket = ["polymarket-client>=0.3.0"]

[project.scripts]
hotflow = "hotflow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["hotflow"]
mypy_path = "src"
